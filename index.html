        body {

            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
        }

        .slide {
            width: 1000px;
            height: 562.5px; /* 16:9 Aspect Ratio */
            background-color: #0b2214; /* Deep dark green */
            margin: 20px auto;
            position: relative;
            box-sizing: border-box;
            padding: 50px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            page-break-after: always;
            overflow: hidden;
        }

        .header {
            border-left: 5px solid #d4af37;
            padding-left: 20px;
            margin-bottom: 30px;
        }

        h1 {
            color: #d4af37;
            font-size: 32px;
            margin: 0 0 10px 0;

        .content {

            color: #e0e0e0;
        }

        .content strong {
            color: #d4af37;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            margin-bottom: 15px;
            padding-left: 20px;
            position: relative;
        }

        li::before {
            content: "■";
            color: #d4af37;
            position: absolute;
            left: 0;
            top: 2px;
            font-size: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #d4af37;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: rgba(212, 175, 55, 0.1);
            color: #d4af37;
        }

        .diagram {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border: 1px solid #d4af37;
            text-align: center;
            font-family: monospace;
            white-space: pre;
            color: #d4af37;
            margin-top: 20px;
        }
